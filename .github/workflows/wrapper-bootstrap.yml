name: wrapper-bootstrap

on:
  pull_request:
    branches: [master, main]
    paths:
      - '.github/workflows/wrapper-bootstrap.yml'

permissions:
  contents: write

jobs:
  generate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.head_ref }}

      - name: Set up JDK
        uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287
        with:
          distribution: temurin
          java-version: 21

      - name: Generate official Maven Wrapper
        run: mvn -B org.apache.maven.plugins:maven-wrapper-plugin:3.3.4:wrapper -Dmaven=3.9.16 -Dtype=only-script

      - name: Verify wrapper contract
        run: |
          grep -Fx 'wrapperVersion=3.3.4' .mvn/wrapper/maven-wrapper.properties
          grep -F 'apache-maven-3.9.16-bin.zip' .mvn/wrapper/maven-wrapper.properties
          chmod +x mvnw
          ./mvnw --version | tee /tmp/maven-version.txt
          grep -F 'Apache Maven 3.9.16' /tmp/maven-version.txt

      - name: Commit wrapper and remove bootstrap
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          rm .github/workflows/wrapper-bootstrap.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mvnw mvnw.cmd .mvn/wrapper/maven-wrapper.properties .github/workflows/wrapper-bootstrap.yml
          git commit -m 'build: pin Maven 3.9.16 with wrapper 3.3.4'
          git push origin "HEAD:${HEAD_REF}"

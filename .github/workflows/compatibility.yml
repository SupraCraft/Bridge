name: compatibility

on:
  push:
    branches: [main, master]
    paths:
      - 'pom.xml'
      - 'bridge*/**'
      - 'COMPATIBILITY.json'
      - 'schemas/**'
      - 'scripts/**'
      - '.mvn/wrapper/**'
      - 'mvnw'
      - 'mvnw.cmd'
      - '.github/workflows/compatibility.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'pom.xml'
      - 'bridge*/**'
      - 'COMPATIBILITY.json'
      - 'schemas/**'
      - 'scripts/**'
      - '.mvn/wrapper/**'
      - 'mvnw'
      - 'mvnw.cmd'
      - '.github/workflows/compatibility.yml'
  schedule:
    - cron: '37 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compatibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  supported-hosts:
    name: host-jdk-${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['21', '25', '26']
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Record toolchain
        run: |
          java --version
          ./mvnw --version
          test "$(./mvnw -q -DforceStdout help:evaluate -Dexpression=asm.version)" = '9.10.1'

      - name: Build and verify reactor
        run: ./mvnw -B verify

      - name: Validate Bridge run report
        run: python3 scripts/check-run-report.py build/bridge-test/bridge/bridge-report.json

      - name: Verify emitted Java 21 bytecode baseline
        run: |
          javap -verbose -classpath build/bridge/bridge-0.1.0-dev.jar bridge.Bridge > /tmp/bridge-javap.txt
          grep -F 'major version: 65' /tmp/bridge-javap.txt

      - name: Verify transformed fixtures with JDK Class-File API
        if: matrix.java != '21'
        run: >-
          java scripts/VerifyClassFiles.java
          build/bridge-test/classes
          build/bridge/classes
          build/bridge-asm/classes
          build/bridge-plugin/classes
          build/bridge-test/classes

      - name: Verify packaged multi-release fork
        run: |
          jar='build/bridge-test/bridge-test-0.1.0-dev.jar'
          test -s "$jar"
          unzip -p "$jar" META-INF/MANIFEST.MF | tr -d '\r' > /tmp/bridge-test-manifest.mf
          grep -Fx 'Multi-Release: true' /tmp/bridge-test-manifest.mf
          unzip -l "$jar" | grep -F 'META-INF/versions/25/bridge/objects/Forks.class'
          java -Xverify:all -cp "$jar" bridge.objects.Forks

  next-jdk-advisory:
    name: host-jdk-27-ea-advisory
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Set up JDK 27 RC from jdk.java.net
        uses: oracle-actions/setup-java@155c7e556815196c3131aa35c56caedd0c912052
        with:
          website: jdk.java.net
          release: 27
          version: latest

      - name: Record advisory toolchain
        run: |
          java --version
          ./mvnw --version

      - name: Advisory reactor verification
        run: ./mvnw -B verify

      - name: Validate Bridge run report
        run: python3 scripts/check-run-report.py build/bridge-test/bridge/bridge-report.json

      - name: Verify transformed fixtures with JDK Class-File API
        run: >-
          java scripts/VerifyClassFiles.java
          build/bridge-test/classes
          build/bridge/classes
          build/bridge-asm/classes
          build/bridge-plugin/classes
          build/bridge-test/classes

      - name: Verify packaged multi-release fork
        run: |
          jar='build/bridge-test/bridge-test-0.1.0-dev.jar'
          test -s "$jar"
          unzip -p "$jar" META-INF/MANIFEST.MF | tr -d '\r' > /tmp/bridge-test-manifest.mf
          grep -Fx 'Multi-Release: true' /tmp/bridge-test-manifest.mf
          unzip -l "$jar" | grep -F 'META-INF/versions/25/bridge/objects/Forks.class'
          java -Xverify:all -cp "$jar" bridge.objects.Forks

name: build-and-publish

on:
  push:
    branches: [main, master]
    tags: ["v*"]
    paths:
      - 'src/**'
      - 'pom.xml'
      - 'bridge*/**'
      - 'docs/**'
      - '.github/workflows/build.yml'
      - 'VERSIONING.md'
  pull_request:
    branches: [main, master]
    paths:
      - 'src/**'
      - 'pom.xml'
      - 'bridge*/**'
      - 'docs/**'
      - '.github/workflows/build.yml'
      - 'VERSIONING.md'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag to publish (for manual runs)"
        required: false

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

env:
  BRIDGE_OWNER: ${{ github.repository_owner }}
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  SOURCE_REF: ${{ github.head_ref || github.ref }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Verify no placeholder versions
        run: |
          if grep -F -- '-PLACEHOLDER' pom.xml bridge*/pom.xml; then
            echo "Found placeholder versions. Please replace -PLACEHOLDER before building."
            exit 1
          fi

      - name: Set up JDK
        uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Derive version
        id: version
        env:
          RELEASE_TAG: ${{ github.event.inputs.release_tag || '' }}
        run: |
          if [[ -n "${RELEASE_TAG}" ]]; then
            VER="${RELEASE_TAG#v}"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VER="${GITHUB_REF_NAME#v}"
          else
            SOURCE_VERSION="$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)"
            BASE_VERSION="${SOURCE_VERSION%%-SNAPSHOT*}"
            VER="${BASE_VERSION}-SNAPSHOT.${GITHUB_RUN_NUMBER}"
          fi
          echo "VALUE=$VER" >> "$GITHUB_OUTPUT"

      - name: Set project version
        run: mvn -B -q versions:set -DnewVersion=${{ steps.version.outputs.VALUE }} -DgenerateBackupPoms=false

      - name: Build, test, and generate SBOM
        run: >-
          mvn -B verify
          -Dbuild.commit=${SOURCE_SHA}
          -Dbuild.ref=${SOURCE_REF}
          -Dbuild.number=${GITHUB_RUN_NUMBER}

      - name: Generate checksums
        run: |
          find build -type f -name 'bridge-*.jar' -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          sha256sum target/bridge-sbom.json >> SHA256SUMS

      - name: Upload build evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: bridge-build-${{ steps.version.outputs.VALUE }}
          path: |
            build/**/bridge-*.jar
            target/bridge-sbom.json
            SHA256SUMS
          if-no-files-found: error

  publish:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Set up JDK
        uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          server-id: github

      - name: Derive version
        id: version
        env:
          RELEASE_TAG: ${{ github.event.inputs.release_tag || '' }}
        run: |
          if [[ -n "${RELEASE_TAG}" ]]; then
            VER="${RELEASE_TAG#v}"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VER="${GITHUB_REF_NAME#v}"
          else
            SOURCE_VERSION="$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)"
            BASE_VERSION="${SOURCE_VERSION%%-SNAPSHOT*}"
            VER="${BASE_VERSION}-SNAPSHOT.${GITHUB_RUN_NUMBER}"
          fi
          echo "VALUE=$VER" >> "$GITHUB_OUTPUT"

      - name: Set project version
        run: mvn -B -q versions:set -DnewVersion=${{ steps.version.outputs.VALUE }} -DgenerateBackupPoms=false

      - name: Publish exact version to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          mvn -B -DskipTests
          -Dbuild.commit=${SOURCE_SHA}
          -Dbuild.ref=${SOURCE_REF}
          -Dbuild.number=${GITHUB_RUN_NUMBER}
          -DaltDeploymentRepository=github::default::https://maven.pkg.github.com/${BRIDGE_OWNER}/Bridge
          deploy

      - name: Build static Maven repo for Pages
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        run: |
          rm -rf docs/maven
          mkdir -p docs/maven
          mvn -B -DskipTests \
            -Dbuild.commit=${SOURCE_SHA} \
            -Dbuild.ref=${SOURCE_REF} \
            -Dbuild.number=${GITHUB_RUN_NUMBER} \
            -DaltDeploymentRepository=pages::default::file://${{ github.workspace }}/docs/maven deploy

      - name: Generate release checksums
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        run: |
          find build -type f -name 'bridge-*.jar' -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          sha256sum target/bridge-sbom.json >> SHA256SUMS

      - name: Attach provenance assets to release
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        uses: softprops/action-gh-release@7c4723f7a335432393329f8f1c564994ce50185d
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          files: |
            build/**/bridge-*.jar
            target/bridge-sbom.json
            SHA256SUMS
          fail_on_unmatched_files: true

      - name: Upload Pages artifact
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: docs

  deploy-pages:
    if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: true
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128

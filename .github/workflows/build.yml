name: build-and-publish

on:
  push:
    branches: [main, master]
    tags: ["v*"]
    paths:
      - 'pom.xml'
      - 'bridge*/**'
      - 'scripts/**'
      - 'mvnw'
      - 'mvnw.cmd'
      - '.mvn/wrapper/**'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'pom.xml'
      - 'bridge*/**'
      - 'scripts/**'
      - 'mvnw'
      - 'mvnw.cmd'
      - '.mvn/wrapper/**'
      - 'docs/**'
      - '.github/workflows/build.yml'
      - 'README.md'
      - 'VERSIONING.md'
      - 'ARTIFACT_IDENTITY.md'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag to publish (for manual runs)"
        required: false

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

env:
  BRIDGE_OWNER: ${{ github.repository_owner }}
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  SOURCE_REF: ${{ github.head_ref || github.ref }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Verify artifact identity
        run: |
          if grep -R -F --include='pom.xml' 'net.ME1312.ASM' .; then
            echo "Legacy upstream Maven coordinates remain in active POMs."
            exit 1
          fi
          grep -F '<groupId>io.github.supracraft.bridge</groupId>' pom.xml
          grep -F '<version>0.1.0-dev</version>' pom.xml

      - name: Set up JDK
        uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Verify pinned Maven
        run: |
          ./mvnw --version | tee /tmp/maven-version.txt
          grep -F 'Apache Maven 3.9.16' /tmp/maven-version.txt

      - name: Derive version
        id: version
        env:
          RELEASE_TAG: ${{ github.event.inputs.release_tag || '' }}
        run: |
          if [[ -n "${RELEASE_TAG}" ]]; then
            VER="${RELEASE_TAG#v}"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VER="${GITHUB_REF_NAME#v}"
          else
            SOURCE_VERSION="$(python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('pom.xml').getroot()
          ns = {'m': 'http://maven.apache.org/POM/4.0.0'}
          print(root.find('m:version', ns).text.strip())
          PY
          )"
            case "${SOURCE_VERSION}" in
              *-dev) VER="${SOURCE_VERSION}.${GITHUB_RUN_NUMBER}" ;;
              *) echo "Non-release source version must end in -dev; got ${SOURCE_VERSION}" >&2; exit 1 ;;
            esac
          fi
          echo "VALUE=$VER" >> "$GITHUB_OUTPUT"

      - name: Set project version
        run: ./mvnw -B -q org.codehaus.mojo:versions-maven-plugin:2.21.0:set -DnewVersion=${{ steps.version.outputs.VALUE }} -DgenerateBackupPoms=false

      - name: Build, test, and generate SBOM
        run: >-
          ./mvnw -B verify
          -Dbuild.commit=${SOURCE_SHA}
          -Dbuild.ref=${SOURCE_REF}
          -Dbuild.number=${GITHUB_RUN_NUMBER}

      - name: Prove reproducible published JARs
        run: >-
          bash ./scripts/verify-reproducible-build.sh
          '${{ steps.version.outputs.VALUE }}'
          '${SOURCE_SHA}'
          '${SOURCE_REF}'
          '${GITHUB_RUN_NUMBER}'

      - name: Verify produced coordinates and provenance
        run: |
          test "$(./mvnw -q -DforceStdout help:evaluate -Dexpression=project.groupId)" = 'io.github.supracraft.bridge'
          test "$(./mvnw -q -DforceStdout help:evaluate -Dexpression=project.version)" = '${{ steps.version.outputs.VALUE }}'
          unzip -p build/bridge/bridge-${{ steps.version.outputs.VALUE }}.jar META-INF/MANIFEST.MF | tr -d '\r' > /tmp/bridge-manifest.mf
          grep -Fx 'Implementation-Vendor: SupraCraft' /tmp/bridge-manifest.mf
          grep -Fx 'Source-Repository: SupraCraft/Bridge' /tmp/bridge-manifest.mf
          grep -Fx 'Upstream-Repository: ME1312/Bridge' /tmp/bridge-manifest.mf

      - name: Stage standalone artifacts
        run: bash ./scripts/stage-standalone-artifacts.sh '${{ steps.version.outputs.VALUE }}'

      - name: Record build metadata
        run: |
          cat > BUILD-METADATA.properties <<EOF
          group=io.github.supracraft.bridge
          version=${{ steps.version.outputs.VALUE }}
          source.repository=SupraCraft/Bridge
          upstream.repository=ME1312/Bridge
          git.commit=${SOURCE_SHA}
          git.ref=${SOURCE_REF}
          github.run=${GITHUB_RUN_NUMBER}
          maven.version=3.9.16
          maven.wrapper.version=3.3.4
          EOF

      - name: Generate checksums
        run: sha256sum dist/* BUILD-METADATA.properties REPRODUCIBILITY.properties > SHA256SUMS

      - name: Upload build evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: supracraft-bridge-${{ steps.version.outputs.VALUE }}
          path: |
            dist/*
            BUILD-METADATA.properties
            REPRODUCIBILITY.properties
            SHA256SUMS
          if-no-files-found: error

  publish:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Set up JDK
        uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          server-id: github

      - name: Verify pinned Maven
        run: |
          ./mvnw --version | tee /tmp/maven-version.txt
          grep -F 'Apache Maven 3.9.16' /tmp/maven-version.txt

      - name: Derive version
        id: version
        env:
          RELEASE_TAG: ${{ github.event.inputs.release_tag || '' }}
        run: |
          if [[ -n "${RELEASE_TAG}" ]]; then
            VER="${RELEASE_TAG#v}"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VER="${GITHUB_REF_NAME#v}"
          else
            SOURCE_VERSION="$(python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('pom.xml').getroot()
          ns = {'m': 'http://maven.apache.org/POM/4.0.0'}
          print(root.find('m:version', ns).text.strip())
          PY
          )"
            case "${SOURCE_VERSION}" in
              *-dev) VER="${SOURCE_VERSION}.${GITHUB_RUN_NUMBER}" ;;
              *) echo "Non-release source version must end in -dev; got ${SOURCE_VERSION}" >&2; exit 1 ;;
            esac
          fi
          echo "VALUE=$VER" >> "$GITHUB_OUTPUT"

      - name: Set project version
        run: ./mvnw -B -q org.codehaus.mojo:versions-maven-plugin:2.21.0:set -DnewVersion=${{ steps.version.outputs.VALUE }} -DgenerateBackupPoms=false

      - name: Publish exact version to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          ./mvnw -B -DskipTests
          -Dbuild.commit=${SOURCE_SHA}
          -Dbuild.ref=${SOURCE_REF}
          -Dbuild.number=${GITHUB_RUN_NUMBER}
          -DaltDeploymentRepository=github::default::https://maven.pkg.github.com/${BRIDGE_OWNER}/Bridge
          deploy

      - name: Build static Maven repo for Pages
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        run: |
          rm -rf docs/maven
          mkdir -p docs/maven
          ./mvnw -B -DskipTests \
            -Dbuild.commit=${SOURCE_SHA} \
            -Dbuild.ref=${SOURCE_REF} \
            -Dbuild.number=${GITHUB_RUN_NUMBER} \
            -DaltDeploymentRepository=pages::default::file://${{ github.workspace }}/docs/maven deploy

      - name: Stage standalone release artifacts
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        run: bash ./scripts/stage-standalone-artifacts.sh '${{ steps.version.outputs.VALUE }}'

      - name: Record release metadata
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        run: |
          cat > BUILD-METADATA.properties <<EOF
          group=io.github.supracraft.bridge
          version=${{ steps.version.outputs.VALUE }}
          source.repository=SupraCraft/Bridge
          upstream.repository=ME1312/Bridge
          git.commit=${SOURCE_SHA}
          git.ref=${SOURCE_REF}
          github.run=${GITHUB_RUN_NUMBER}
          maven.version=3.9.16
          maven.wrapper.version=3.3.4
          EOF

      - name: Generate release checksums
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        run: sha256sum dist/* BUILD-METADATA.properties > SHA256SUMS

      - name: Attach SupraCraft provenance assets to release
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        uses: softprops/action-gh-release@7c4723f7a335432393329f8f1c564994ce50185d
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          files: |
            dist/*
            BUILD-METADATA.properties
            SHA256SUMS
          fail_on_unmatched_files: true

      - name: Upload Pages artifact
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: docs

  deploy-pages:
    if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: true
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128

name: documentation-contract

on:
  push:
    branches: [master, main]
    paths:
      - 'README.md'
      - 'AGENTS.md'
      - 'PROJECT_CONTRACT.json'
      - 'COMPATIBILITY.json'
      - 'BRAND_PROFILE.json'
      - 'GITHUB_METADATA.json'
      - 'VERSIONING.md'
      - 'ARTIFACT_IDENTITY.md'
      - 'docs/**'
      - 'schemas/**'
      - 'compatibility/**'
      - 'scripts/check-documentation-contract.sh'
      - 'scripts/check-release-qualification-contract.py'
      - 'scripts/check-version-neutral-workflows.py'
      - 'scripts/aggregate-release-qualification.py'
      - 'scripts/validate-release-candidate.py'
      - 'scripts/validate-stable-release.py'
      - 'scripts/resolve-release-context.py'
      - 'scripts/assert-maven-version-absent.sh'
      - 'scripts/assert-maven-version-present.sh'
      - 'scripts/build-public-site.py'
      - 'scripts/check-public-site.py'
      - 'scripts/check-run-report.py'
      - 'scripts/run-classfile-compatibility.sh'
      - 'scripts/run-modern-bytecode-compatibility.sh'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/workflows/documentation.yml'
      - '.github/workflows/compatibility.yml'
      - '.github/workflows/classfile-compatibility.yml'
      - '.github/workflows/modern-bytecode-compatibility.yml'
      - '.github/workflows/release-qualification.yml'
      - '.github/workflows/pages.yml'
      - 'pom.xml'
      - 'bridge/pom.xml'
      - 'bridge-asm/pom.xml'
      - 'bridge-plugin/pom.xml'
      - 'bridge/resources/**'
      - '.mvn/wrapper/**'
  pull_request:
    branches: [master, main]
    paths:
      - 'README.md'
      - 'AGENTS.md'
      - 'PROJECT_CONTRACT.json'
      - 'COMPATIBILITY.json'
      - 'BRAND_PROFILE.json'
      - 'GITHUB_METADATA.json'
      - 'VERSIONING.md'
      - 'ARTIFACT_IDENTITY.md'
      - 'docs/**'
      - 'schemas/**'
      - 'compatibility/**'
      - 'scripts/check-documentation-contract.sh'
      - 'scripts/check-release-qualification-contract.py'
      - 'scripts/check-version-neutral-workflows.py'
      - 'scripts/aggregate-release-qualification.py'
      - 'scripts/validate-release-candidate.py'
      - 'scripts/validate-stable-release.py'
      - 'scripts/resolve-release-context.py'
      - 'scripts/assert-maven-version-absent.sh'
      - 'scripts/assert-maven-version-present.sh'
      - 'scripts/build-public-site.py'
      - 'scripts/check-public-site.py'
      - 'scripts/check-run-report.py'
      - 'scripts/run-classfile-compatibility.sh'
      - 'scripts/run-modern-bytecode-compatibility.sh'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/workflows/documentation.yml'
      - '.github/workflows/compatibility.yml'
      - '.github/workflows/classfile-compatibility.yml'
      - '.github/workflows/modern-bytecode-compatibility.yml'
      - '.github/workflows/release-qualification.yml'
      - '.github/workflows/pages.yml'
      - 'pom.xml'
      - 'bridge/pom.xml'
      - 'bridge-asm/pom.xml'
      - 'bridge-plugin/pom.xml'
      - 'bridge/resources/**'
      - '.mvn/wrapper/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Validate documentation and public surface
        run: bash ./scripts/check-documentation-contract.sh
      - name: Validate release qualification contract
        run: python3 ./scripts/check-release-qualification-contract.py
      - name: Validate version-neutral reusable workflows
        run: python3 ./scripts/check-version-neutral-workflows.py

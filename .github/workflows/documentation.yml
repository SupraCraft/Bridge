name: documentation-contract

on:
  push:
    branches: [master, main]
    paths:
      - 'README.md'
      - 'AGENTS.md'
      - 'PROJECT_CONTRACT.json'
      - 'COMPATIBILITY.json'
      - 'BRAND_PROFILE.json'
      - 'GITHUB_METADATA.json'
      - 'VERSIONING.md'
      - 'ARTIFACT_IDENTITY.md'
      - 'docs/**'
      - 'schemas/**'
      - 'compatibility/**'
      - 'release/**'
      - 'scripts/check-documentation-contract.sh'
      - 'scripts/check-public-site-readiness-contract.py'
      - 'scripts/check-release-qualification-contract.py'
      - 'scripts/check-version-neutral-workflows.py'
      - 'scripts/aggregate-release-qualification.py'
      - 'scripts/validate-release-candidate.py'
      - 'scripts/validate-stable-release.py'
      - 'scripts/resolve-release-context.py'
      - 'scripts/assert-maven-version-absent.sh'
      - 'scripts/assert-maven-version-present.sh'
      - 'scripts/build-public-site.py'
      - 'scripts/check-public-site.py'
      - 'scripts/check-run-report.py'
      - 'scripts/run-classfile-compatibility.sh'
      - 'scripts/run-modern-bytecode-compatibility.sh'
      - 'package.json'
      - 'playwright.config.mjs'
      - 'lighthouserc.cjs'
      - 'tests/site/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/workflows/documentation.yml'
      - '.github/workflows/compatibility.yml'
      - '.github/workflows/classfile-compatibility.yml'
      - '.github/workflows/modern-bytecode-compatibility.yml'
      - '.github/workflows/release-qualification.yml'
      - '.github/workflows/public-site-readiness.yml'
      - '.github/workflows/pages.yml'
      - 'pom.xml'
      - 'bridge/pom.xml'
      - 'bridge-asm/pom.xml'
      - 'bridge-plugin/pom.xml'
      - 'bridge/resources/**'
      - '.mvn/wrapper/**'
  pull_request:
    branches: [master, main]
    paths:
      - 'README.md'
      - 'AGENTS.md'
      - 'PROJECT_CONTRACT.json'
      - 'COMPATIBILITY.json'
      - 'BRAND_PROFILE.json'
      - 'GITHUB_METADATA.json'
      - 'VERSIONING.md'
      - 'ARTIFACT_IDENTITY.md'
      - 'docs/**'
      - 'schemas/**'
      - 'compatibility/**'
      - 'release/**'
      - 'scripts/check-documentation-contract.sh'
      - 'scripts/check-public-site-readiness-contract.py'
      - 'scripts/check-release-qualification-contract.py'
      - 'scripts/check-version-neutral-workflows.py'
      - 'scripts/aggregate-release-qualification.py'
      - 'scripts/validate-release-candidate.py'
      - 'scripts/validate-stable-release.py'
      - 'scripts/resolve-release-context.py'
      - 'scripts/assert-maven-version-absent.sh'
      - 'scripts/assert-maven-version-present.sh'
      - 'scripts/build-public-site.py'
      - 'scripts/check-public-site.py'
      - 'scripts/check-run-report.py'
      - 'scripts/run-classfile-compatibility.sh'
      - 'scripts/run-modern-bytecode-compatibility.sh'
      - 'package.json'
      - 'playwright.config.mjs'
      - 'lighthouserc.cjs'
      - 'tests/site/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/workflows/documentation.yml'
      - '.github/workflows/compatibility.yml'
      - '.github/workflows/classfile-compatibility.yml'
      - '.github/workflows/modern-bytecode-compatibility.yml'
      - '.github/workflows/release-qualification.yml'
      - '.github/workflows/public-site-readiness.yml'
      - '.github/workflows/pages.yml'
      - 'pom.xml'
      - 'bridge/pom.xml'
      - 'bridge-asm/pom.xml'
      - 'bridge-plugin/pom.xml'
      - 'bridge/resources/**'
      - '.mvn/wrapper/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Validate documentation and public surface
        run: bash ./scripts/check-documentation-contract.sh
      - name: Validate public-site readiness wiring
        run: python3 ./scripts/check-public-site-readiness-contract.py
      - name: Validate release qualification contract
        run: python3 ./scripts/check-release-qualification-contract.py
      - name: Validate version-neutral reusable workflows
        run: python3 ./scripts/check-version-neutral-workflows.py
      - name: Validate constructive public projection
        if: ${{ hashFiles('release/public-projection.json') != '' }}
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          cutover='7f03c53ca46bb4272f9643ff078708cbf81498ff'
          git fetch --no-tags --depth=1 origin "$SOURCE_SHA" "$cutover"
          out="$RUNNER_TEMP/bridge-public-projection"
          receipt="$RUNNER_TEMP/bridge-public-projection-receipt.json"
          rm -rf "$out" "$receipt"
          python3 release/project-public.py \
            --source-ref "$SOURCE_SHA" \
            --output "$out" \
            --receipt "$receipt" \
            --verify-determinism
          test ! -e "$out/release/public-projection.json"
          test ! -e "$out/release/project-public.py"
          python3 - "$receipt" <<'PY'
          import json
          import sys
          from pathlib import Path
          receipt = json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          assert receipt['status'] == 'pass'
          assert receipt['determinismVerified'] is True
          assert receipt['fileCount'] > 0
          PY

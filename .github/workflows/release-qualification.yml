name: release-qualification

on:
  push:
    branches: [main, master, 'release/**', 'stable/**']
    paths:
      - 'pom.xml'
      - 'bridge*/**'
      - 'COMPATIBILITY.json'
      - 'PROJECT_CONTRACT.json'
      - 'RELEASE_CANDIDATE.json'
      - 'STABLE_RELEASE.json'
      - 'release-candidates/**'
      - 'compatibility/**'
      - 'schemas/release-candidate.schema.json'
      - 'schemas/stable-release.schema.json'
      - 'scripts/VerifyClassFiles.java'
      - 'scripts/check-documentation-contract.sh'
      - 'scripts/check-run-report.py'
      - 'scripts/run-classfile-compatibility.sh'
      - 'scripts/run-modern-bytecode-compatibility.sh'
      - 'scripts/aggregate-release-qualification.py'
      - 'scripts/validate-release-candidate.py'
      - 'scripts/validate-stable-release.py'
      - 'scripts/resolve-release-context.py'
      - 'scripts/assert-maven-version-absent.sh'
      - 'scripts/assert-maven-version-present.sh'
      - '.github/workflows/release-qualification.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'COMPATIBILITY.json'
      - 'PROJECT_CONTRACT.json'
      - 'release-candidates/**'
      - 'schemas/release-candidate.schema.json'
      - 'schemas/stable-release.schema.json'
      - 'scripts/aggregate-release-qualification.py'
      - 'scripts/validate-release-candidate.py'
      - 'scripts/validate-stable-release.py'
      - 'scripts/resolve-release-context.py'
      - 'scripts/assert-maven-version-absent.sh'
      - 'scripts/assert-maven-version-present.sh'
      - '.github/workflows/release-qualification.yml'
  schedule:
    - cron: '47 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: release-qualification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  BRIDGE_OWNER: ${{ github.repository_owner }}

jobs:
  context:
    name: release-qualification-context
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_line: ${{ steps.version.outputs.release_line }}
      mode: ${{ steps.version.outputs.mode }}
      is_candidate: ${{ steps.version.outputs.is_candidate }}
      is_stable: ${{ steps.version.outputs.is_stable }}
      is_release: ${{ steps.version.outputs.is_release }}
      candidate: ${{ steps.version.outputs.candidate }}
      candidate_source: ${{ steps.version.outputs.candidate_source }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Resolve qualification context
        id: version
        run: >-
          python3 scripts/resolve-release-context.py
          --ref "$GITHUB_REF"
          --github-output "$GITHUB_OUTPUT"

      - name: Require unused immutable release coordinate
        if: steps.version.outputs.is_release == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/assert-maven-version-absent.sh '${{ steps.version.outputs.version }}'

      - name: Require unused stable tag
        if: steps.version.outputs.is_stable == 'true'
        run: |
          tag='${{ steps.version.outputs.tag }}'
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "Stable tag already exists: ${tag}" >&2
            exit 1
          fi

  release-build:
    name: tested-release-build
    if: needs.context.outputs.is_release == 'true'
    needs: context
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout exact source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Set up JDK 21
        uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Verify pinned Maven
        run: |
          ./mvnw --version | tee /tmp/maven-version.txt
          grep -F 'Apache Maven 3.9.16' /tmp/maven-version.txt

      - name: Validate stable source surface
        if: needs.context.outputs.is_stable == 'true'
        run: bash scripts/check-documentation-contract.sh

      - name: Set exact release version
        run: >-
          ./mvnw -B -q org.codehaus.mojo:versions-maven-plugin:2.21.0:set
          -DnewVersion='${{ needs.context.outputs.version }}'
          -DgenerateBackupPoms=false

      - name: Build and test exact release
        run: >-
          ./mvnw -B verify
          -Dbuild.commit=${SOURCE_SHA}
          -Dbuild.ref=${GITHUB_REF}
          -Dbuild.number=${GITHUB_RUN_NUMBER}

      - name: Prove reproducible release JARs
        run: >-
          bash scripts/verify-reproducible-build.sh
          '${{ needs.context.outputs.version }}'
          '${SOURCE_SHA}'
          '${GITHUB_REF}'
          '${GITHUB_RUN_NUMBER}'

      - name: Verify release coordinates and provenance
        run: |
          version='${{ needs.context.outputs.version }}'
          test "$(./mvnw -q -DforceStdout help:evaluate -Dexpression=project.version)" = "$version"
          unzip -p "build/bridge/bridge-${version}.jar" META-INF/MANIFEST.MF | tr -d '\r' > /tmp/bridge-release-manifest.mf
          grep -Fx "Implementation-Version: ${version}" /tmp/bridge-release-manifest.mf
          grep -Fx 'Implementation-Vendor: SupraCraft' /tmp/bridge-release-manifest.mf
          grep -Fx 'Source-Repository: SupraCraft/Bridge' /tmp/bridge-release-manifest.mf
          grep -Fx 'Upstream-Repository: ME1312/Bridge' /tmp/bridge-release-manifest.mf
          grep -Fx "Build-Commit: ${SOURCE_SHA}" /tmp/bridge-release-manifest.mf
          grep -Fx "Build-Ref: ${GITHUB_REF}" /tmp/bridge-release-manifest.mf
          grep -Fx "Build-Number: ${GITHUB_RUN_NUMBER}" /tmp/bridge-release-manifest.mf

      - name: Verify tested-artifact promotion locally
        run: |
          rm -rf /tmp/bridge-release-maven-repo
          mkdir -p /tmp/bridge-release-maven-repo
          bash scripts/deploy-tested-artifacts.sh \
            '${{ needs.context.outputs.version }}' \
            local \
            'file:///tmp/bridge-release-maven-repo'
          base='/tmp/bridge-release-maven-repo/io/github/supracraft/bridge'
          version='${{ needs.context.outputs.version }}'
          test -s "$base/bridge-parent/$version/bridge-parent-$version.pom"
          for artifact in bridge bridge-asm bridge-plugin bridge-test; do
            published="$base/$artifact/$version/$artifact-$version.jar"
            built="build/$artifact/$artifact-$version.jar"
            test -s "$published"
            cmp "$built" "$published"
          done

      - name: Stage standalone release artifacts
        run: bash scripts/stage-standalone-artifacts.sh '${{ needs.context.outputs.version }}'

      - name: Record release build metadata
        run: |
          cat > BUILD-METADATA.properties <<EOF
          group=io.github.supracraft.bridge
          version=${{ needs.context.outputs.version }}
          release.kind=${{ needs.context.outputs.mode }}
          release.candidate=${{ needs.context.outputs.is_candidate }}
          release.stable=${{ needs.context.outputs.is_stable }}
          source.repository=SupraCraft/Bridge
          upstream.repository=ME1312/Bridge
          git.commit=${SOURCE_SHA}
          git.ref=${GITHUB_REF}
          github.run=${GITHUB_RUN_NUMBER}
          maven.version=3.9.16
          maven.wrapper.version=3.3.4
          EOF
          sha256sum dist/* BUILD-METADATA.properties REPRODUCIBILITY.properties > SHA256SUMS

      - name: Upload tested release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: bridge-release-build-${{ needs.context.outputs.version }}
          path: |
            dist/*
            BUILD-METADATA.properties
            REPRODUCIBILITY.properties
            SHA256SUMS
          if-no-files-found: error
          retention-days: 90

      - name: Upload tested Maven publication inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: bridge-release-publication-${{ needs.context.outputs.version }}
          path: |
            pom.xml
            bridge-asm/pom.xml
            bridge-plugin/pom.xml
            bridge/pom.xml
            bridge-test/pom.xml
            build/bridge-asm/bridge-asm-${{ needs.context.outputs.version }}.jar
            build/bridge-plugin/bridge-plugin-${{ needs.context.outputs.version }}.jar
            build/bridge/bridge-${{ needs.context.outputs.version }}.jar
            build/bridge-test/bridge-test-${{ needs.context.outputs.version }}.jar
          if-no-files-found: error
          retention-days: 1

  host-jvms:
    name: release-host-jdk-${{ matrix.java }}
    needs: context
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['21', '22', '23', '24', '25', '26']
    steps:
      - name: Checkout exact source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Set exact release version
        if: needs.context.outputs.is_release == 'true'
        run: >-
          ./mvnw -B -q org.codehaus.mojo:versions-maven-plugin:2.21.0:set
          -DnewVersion='${{ needs.context.outputs.version }}'
          -DgenerateBackupPoms=false

      - name: Verify full reactor
        run: ./mvnw -B verify

      - name: Validate structured run report
        run: python3 scripts/check-run-report.py build/bridge-test/bridge/bridge-report.json

      - name: Verify Java 21 product bytecode baseline
        run: |
          version='${{ needs.context.outputs.version }}'
          javap -verbose -classpath "build/bridge/bridge-${version}.jar" bridge.Bridge > /tmp/bridge-release-javap.txt
          grep -F 'major version: 65' /tmp/bridge-release-javap.txt

      - name: Verify transformed fixtures with JDK Class-File API when available
        run: |
          host='${{ matrix.java }}'
          if (( host >= 24 )); then
            java scripts/VerifyClassFiles.java \
              build/bridge-test/classes \
              build/bridge/classes \
              build/bridge-asm/classes \
              build/bridge-plugin/classes
          else
            echo "JDK Class-File API is not available on host JDK $host; covered by JDK 24+ release lanes."
          fi

      - name: Verify packaged multi-release behavior
        run: |
          version='${{ needs.context.outputs.version }}'
          jar="build/bridge-test/bridge-test-${version}.jar"
          test -s "$jar"
          unzip -p "$jar" META-INF/MANIFEST.MF | tr -d '\r' > /tmp/bridge-release-manifest.mf
          grep -Fx 'Multi-Release: true' /tmp/bridge-release-manifest.mf
          unzip -l "$jar" | grep -F 'META-INF/versions/25/bridge/objects/Forks.class'
          java -Xverify:all -cp "$jar" bridge.objects.Forks

      - name: Record host qualification evidence
        run: |
          mkdir -p build/release-qualification
          python3 - '${{ matrix.java }}' "$SOURCE_SHA" '${{ needs.context.outputs.version }}' "build/release-qualification/host-jdk-${{ matrix.java }}.json" <<'PY'
          import json
          import pathlib
          import sys
          host = int(sys.argv[1])
          source = sys.argv[2]
          version = sys.argv[3]
          output = pathlib.Path(sys.argv[4])
          evidence = {
              "schema": "bridge-host-qualification/1",
              "sourceCommit": source,
              "bridgeSourceVersion": version,
              "hostJavaFeature": host,
              "checks": {
                  "reactorVerify": "pass",
                  "runReport": "pass",
                  "bytecodeBaseline": "pass",
                  "jdkClassFileApiVerify": "pass" if host >= 24 else "not-applicable",
                  "multiReleaseRuntime": "pass",
              },
          }
          output.write_text(json.dumps(evidence, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Upload host qualification evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: bridge-release-host-${{ matrix.java }}
          path: build/release-qualification/host-jdk-${{ matrix.java }}.json
          if-no-files-found: error
          retention-days: 30

  classfile-boundary:
    name: release-classfiles-on-host-${{ matrix.host }}
    needs: context
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        host: ['21', '26']
    steps:
      - name: Checkout exact source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Set up JDK 26 fixture producer
        uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287
        with:
          distribution: temurin
          java-version: 26

      - name: Record JDK 26 home
        run: echo "JDK26_HOME=$JAVA_HOME" >> "$GITHUB_ENV"

      - name: Set up Bridge host JDK ${{ matrix.host }}
        uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287
        with:
          distribution: temurin
          java-version: ${{ matrix.host }}
          cache: maven

      - name: Set exact release version
        if: needs.context.outputs.is_release == 'true'
        run: >-
          ./mvnw -B -q org.codehaus.mojo:versions-maven-plugin:2.21.0:set
          -DnewVersion='${{ needs.context.outputs.version }}'
          -DgenerateBackupPoms=false

      - name: Prove Java 8 through 26 input envelope
        env:
          BRIDGE_VERSION: ${{ needs.context.outputs.version }}
        run: bash scripts/run-classfile-compatibility.sh

      - name: Upload class-file release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: bridge-release-classfiles-${{ matrix.host }}
          path: build/classfile-compatibility/host-${{ matrix.host }}.json
          if-no-files-found: error
          retention-days: 30

  modern-boundary:
    name: release-modern-bytecode-on-host-${{ matrix.host }}
    needs: context
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        host: ['21', '26']
    steps:
      - name: Checkout exact source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Set up JDK 26 fixture producer and verifier
        uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287
        with:
          distribution: temurin
          java-version: 26

      - name: Record JDK 26 home
        run: echo "JDK26_HOME=$JAVA_HOME" >> "$GITHUB_ENV"

      - name: Set up Bridge host JDK ${{ matrix.host }}
        uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287
        with:
          distribution: temurin
          java-version: ${{ matrix.host }}
          cache: maven

      - name: Set exact release version
        if: needs.context.outputs.is_release == 'true'
        run: >-
          ./mvnw -B -q org.codehaus.mojo:versions-maven-plugin:2.21.0:set
          -DnewVersion='${{ needs.context.outputs.version }}'
          -DgenerateBackupPoms=false

      - name: Prove modern bytecode compatibility
        env:
          BRIDGE_VERSION: ${{ needs.context.outputs.version }}
        run: bash scripts/run-modern-bytecode-compatibility.sh

      - name: Upload modern-bytecode release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: bridge-release-modern-${{ matrix.host }}
          path: build/modern-bytecode-compatibility/host-${{ matrix.host }}.json
          if-no-files-found: error
          retention-days: 30

  verdict:
    name: release-qualification-verdict
    if: always()
    needs: [context, release-build, host-jvms, classfile-boundary, modern-boundary]
    runs-on: ubuntu-latest
    steps:
      - name: Require all blocking qualification jobs
        run: |
          test '${{ needs.context.result }}' = 'success'
          test '${{ needs.host-jvms.result }}' = 'success'
          test '${{ needs.classfile-boundary.result }}' = 'success'
          test '${{ needs.modern-boundary.result }}' = 'success'
          if [[ '${{ needs.context.outputs.is_release }}' == 'true' ]]; then
            test '${{ needs.release-build.result }}' = 'success'
          else
            test '${{ needs.release-build.result }}' = 'skipped'
          fi

      - name: Checkout exact source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Download host evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: bridge-release-host-*
          path: build/release-evidence/hosts
          merge-multiple: true

      - name: Download class-file evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: bridge-release-classfiles-*
          path: build/release-evidence/classfiles
          merge-multiple: true

      - name: Download modern-bytecode evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: bridge-release-modern-*
          path: build/release-evidence/modern
          merge-multiple: true

      - name: Aggregate release qualification
        run: >-
          python3 scripts/aggregate-release-qualification.py
          --evidence-root build/release-evidence
          --source-sha "$SOURCE_SHA"
          --bridge-version '${{ needs.context.outputs.version }}'
          --output build/release-qualification/bridge-release-qualification.json

      - name: Publish qualification summary
        run: |
          {
            echo '## Bridge release qualification'
            echo
            echo '- Source SHA: `'$SOURCE_SHA'`'
            echo '- Bridge version: `${{ needs.context.outputs.version }}`'
            echo '- Mode: `${{ needs.context.outputs.mode }}`'
            echo '- Host JVMs: 21, 22, 23, 24, 25, 26'
            echo '- Input class files: Java 8, 11, 17, 21, 22, 23, 24, 25, 26'
            echo '- Boundary transform hosts: 21 and 26'
            echo '- Modern-bytecode cases: Java 21 records/sealed/invokedynamic, Java 25 flexible constructors, Java 21 module-info'
            echo '- Verdict: **PASS**'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload aggregate release qualification
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: bridge-release-qualification
          path: build/release-qualification/bridge-release-qualification.json
          if-no-files-found: error
          retention-days: 90

  candidate-publish:
    name: publish-qualified-release-candidate
    if: >-
      always() &&
      needs.context.outputs.is_candidate == 'true' &&
      needs.context.result == 'success' &&
      needs.release-build.result == 'success' &&
      needs.verdict.result == 'success'
    needs: [context, release-build, verdict]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout exact source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Set up JDK 21 for GitHub Packages
        uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          server-id: github

      - name: Reconfirm immutable coordinate is unused
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/assert-maven-version-absent.sh '${{ needs.context.outputs.version }}'

      - name: Download tested Maven publication inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: bridge-release-publication-${{ needs.context.outputs.version }}
          path: .

      - name: Download tested release evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: bridge-release-build-${{ needs.context.outputs.version }}
          path: candidate-release/evidence

      - name: Download qualification verdict
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: bridge-release-qualification
          path: candidate-release/qualification

      - name: Verify tested publication inputs
        run: |
          version='${{ needs.context.outputs.version }}'
          test "$(./mvnw -q -DforceStdout help:evaluate -Dexpression=project.version)" = "$version"
          for artifact in bridge bridge-asm bridge-plugin bridge-test; do
            test -s "build/$artifact/$artifact-$version.jar"
          done
          python3 - "$SOURCE_SHA" "$version" <<'PY'
          import json
          import sys
          from pathlib import Path
          source, version = sys.argv[1:]
          verdict = json.loads(Path('candidate-release/qualification/bridge-release-qualification.json').read_text())
          assert verdict['status'] == 'pass'
          assert verdict['sourceCommit'] == source
          assert verdict['bridgeSourceVersion'] == version
          PY

      - name: Publish tested candidate bytes to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          bash scripts/deploy-tested-artifacts.sh
          '${{ needs.context.outputs.version }}'
          github
          "https://maven.pkg.github.com/${BRIDGE_OWNER}/Bridge"

      - name: Verify candidate publication is visible
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/assert-maven-version-present.sh '${{ needs.context.outputs.version }}'

      - name: Record candidate publication evidence
        run: |
          mkdir -p candidate-release
          python3 - "$SOURCE_SHA" '${{ needs.context.outputs.version }}' "$GITHUB_RUN_ID" > candidate-release/PUBLISHED.json <<'PY'
          import json
          import sys
          print(json.dumps({
              'schema': 'bridge-release-candidate-publication/1',
              'status': 'published',
              'version': sys.argv[2],
              'sourceCommit': sys.argv[1],
              'repository': 'SupraCraft/Bridge',
              'channel': 'github-packages',
              'workflowRunId': int(sys.argv[3]),
              'immutable': True,
              'consumerQualification': 'required-separately-before-stable',
          }, indent=2))
          PY

      - name: Upload durable candidate evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: supracraft-bridge-${{ needs.context.outputs.version }}-release-candidate
          path: candidate-release/**
          if-no-files-found: error
          retention-days: 90

  stable-publish:
    name: publish-qualified-stable-release
    if: >-
      always() &&
      needs.context.outputs.is_stable == 'true' &&
      needs.context.result == 'success' &&
      needs.release-build.result == 'success' &&
      needs.verdict.result == 'success'
    needs: [context, release-build, verdict]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout exact source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Set up JDK 21 for GitHub Packages
        uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          server-id: github

      - name: Reconfirm stable coordinate and tag are unused
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          bash scripts/assert-maven-version-absent.sh '${{ needs.context.outputs.version }}'
          tag='${{ needs.context.outputs.tag }}'
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "Stable tag already exists: ${tag}" >&2
            exit 1
          fi

      - name: Download tested Maven publication inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: bridge-release-publication-${{ needs.context.outputs.version }}
          path: .

      - name: Download tested stable evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: bridge-release-build-${{ needs.context.outputs.version }}
          path: stable-release/evidence

      - name: Download qualification verdict
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: bridge-release-qualification
          path: stable-release/qualification

      - name: Verify stable publication inputs and qualified candidate binding
        run: |
          version='${{ needs.context.outputs.version }}'
          test "$(./mvnw -q -DforceStdout help:evaluate -Dexpression=project.version)" = "$version"
          for artifact in bridge bridge-asm bridge-plugin bridge-test; do
            test -s "build/$artifact/$artifact-$version.jar"
          done
          python3 - "$SOURCE_SHA" "$version" '${{ needs.context.outputs.candidate }}' <<'PY'
          import json
          import sys
          from pathlib import Path
          source, version, candidate = sys.argv[1:]
          verdict = json.loads(Path('stable-release/qualification/bridge-release-qualification.json').read_text())
          assert verdict['status'] == 'pass'
          assert verdict['sourceCommit'] == source
          assert verdict['bridgeSourceVersion'] == version
          manifest = json.loads(Path('STABLE_RELEASE.json').read_text())
          assert manifest['version'] == version
          assert manifest['candidate'] == candidate
          status = json.loads(Path(manifest['candidate_status']).read_text())
          assert status['status'] == 'published-qualified'
          assert status['eligible_for_stable_promotion'] is True
          assert status['consumer_qualification']['status'] == 'pass'
          assert status['stable_promotion']['decision'] == 'eligible'
          assert status['stable_promotion']['remaining_blockers'] == []
          PY

      - name: Publish exact tested stable bytes to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          bash scripts/deploy-tested-artifacts.sh
          '${{ needs.context.outputs.version }}'
          github
          "https://maven.pkg.github.com/${BRIDGE_OWNER}/Bridge"

      - name: Verify stable publication is visible
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/assert-maven-version-present.sh '${{ needs.context.outputs.version }}'

      - name: Create immutable stable tag
        run: |
          tag='${{ needs.context.outputs.tag }}'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$tag" "$SOURCE_SHA" -m "Bridge ${{ needs.context.outputs.version }}"
          git push origin "refs/tags/${tag}"

      - name: Record stable publication evidence
        run: |
          mkdir -p stable-release
          python3 - "$SOURCE_SHA" '${{ needs.context.outputs.version }}' '${{ needs.context.outputs.tag }}' '${{ needs.context.outputs.candidate }}' "$GITHUB_RUN_ID" > stable-release/PUBLISHED.json <<'PY'
          import json
          import sys
          print(json.dumps({
              'schema': 'bridge-stable-release-publication/1',
              'status': 'published',
              'version': sys.argv[2],
              'tag': sys.argv[3],
              'qualifiedCandidate': sys.argv[4],
              'sourceCommit': sys.argv[1],
              'repository': 'SupraCraft/Bridge',
              'channel': 'github-packages',
              'workflowRunId': int(sys.argv[5]),
              'immutable': True,
          }, indent=2))
          PY

      - name: Publish GitHub release from tested evidence
        uses: softprops/action-gh-release@7c4723f7a335432393329f8f1c564994ce50185d
        with:
          tag_name: ${{ needs.context.outputs.tag }}
          name: Bridge ${{ needs.context.outputs.version }}
          generate_release_notes: true
          files: |
            stable-release/evidence/dist/*
            stable-release/evidence/BUILD-METADATA.properties
            stable-release/evidence/REPRODUCIBILITY.properties
            stable-release/evidence/SHA256SUMS
            stable-release/qualification/bridge-release-qualification.json
            stable-release/PUBLISHED.json
          fail_on_unmatched_files: true

      - name: Upload durable stable evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: supracraft-bridge-${{ needs.context.outputs.version }}-stable-release
          path: stable-release/**
          if-no-files-found: error
          retention-days: 90

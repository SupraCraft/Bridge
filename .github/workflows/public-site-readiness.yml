name: public-site-readiness

on:
  pull_request:
    branches: [master]
    paths:
      - 'PROJECT_CONTRACT.json'
      - 'PUBLIC_SURFACE.json'
      - 'COMPATIBILITY.json'
      - 'GITHUB_METADATA.json'
      - 'CURRENT_STABLE.json'
      - 'docs/**'
      - 'scripts/build-public-site.py'
      - 'scripts/check-public-site.py'
      - 'package.json'
      - 'playwright.config.mjs'
      - 'lighthouserc.cjs'
      - 'tests/site/**'
      - '.github/workflows/public-site-readiness.yml'
      - '.github/workflows/pages.yml'
  push:
    branches: [master]
    paths:
      - 'PROJECT_CONTRACT.json'
      - 'PUBLIC_SURFACE.json'
      - 'COMPATIBILITY.json'
      - 'GITHUB_METADATA.json'
      - 'CURRENT_STABLE.json'
      - 'docs/**'
      - 'scripts/build-public-site.py'
      - 'scripts/check-public-site.py'
      - 'package.json'
      - 'playwright.config.mjs'
      - 'lighthouserc.cjs'
      - 'tests/site/**'
      - '.github/workflows/public-site-readiness.yml'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-site-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  candidate:
    uses: SupraShellScripts/github-ops-lab/.github/workflows/public-site-readiness.yml@a81cede6ae6c8d460c2922aa35103137633abddc
    with:
      build_command: >-
        python3 ./scripts/build-public-site.py
        --output build/public-site
        --base-url http://127.0.0.1:4173/
      validate_command: >-
        python3 ./scripts/check-public-site.py
        --site-dir build/public-site
        --navigation-base http://127.0.0.1:4173/
        && curl -fsSL
        https://raw.githubusercontent.com/SupraShellScripts/github-ops-lab/5af6889bf31a86352f20a5963ed18f4ceaa741d1/scripts/public-web/validate-surface-contract.py
        -o build/validate-surface-contract.py
        && python3 build/validate-surface-contract.py
        --contract PUBLIC_SURFACE.json
        --site-dir build/public-site
        --navigation-base http://127.0.0.1:4173/
        --evidence build/public-surface-conformance.json
      lychee_args: >-
        --verbose
        --no-progress
        --max-retries 2
        --timeout 20
        --accept 200,204,206,429
        --exclude '^http://127\.0\.0\.1(:[0-9]+)?/'
        --exclude '^https://supracraft\.github\.io/Bridge/'
        './README.md'
        './docs/**/*.md'
        './build/public-site/**/*.html'
      evidence_paths: |
        build/playwright-report
        build/playwright-results
        build/lighthouse
        build/public-surface-conformance.json
        lychee/out.md
